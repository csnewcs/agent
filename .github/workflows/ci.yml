name: CI & Native Multi-Arch Docker Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BOT: ghcr.io/${{ github.repository }}/bot

jobs:
  # --- 1. CI Code Verification ---
  check-bot:
    name: Build & Test Go Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'bot/go.mod'
          cache-dependency-path: 'bot/go.sum'

      - name: Build Go Bot
        working-directory: ./bot
        run: |
          go mod download
          go build -v ./...

  # --- 2. Native Multi-Arch Image Builds ---
  build-native-images:
    name: Build Native Bot Image (${{ matrix.platform.arch }})
    needs: [check-bot]
    runs-on: ${{ matrix.platform.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runs_on: fedora43
          - arch: arm64
            runs_on: ubuntu-24.04-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push Bot Image Digest
      - name: Build & Push Bot Digest (${{ matrix.platform.arch }})
        id: build-bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          file: ./bot/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAME_BOT }},push-by-digest=true,name-canonical=true,push=true

      - name: Save Digest Artifacts
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build-bot.outputs.digest }}" > /tmp/digests/bot-${{ matrix.platform.arch }}

      - name: Upload Digest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- 3. Merge Manifests into Multi-Arch Image ---
  merge-manifests:
    name: Combine Multi-Arch Manifests
    needs: build-native-images
    runs-on: ubuntu-latest
    steps:
      - name: Download All Digest Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge & Push Bot Multi-Arch Image
        run: |
          BOT_AMD64=$(cat /tmp/digests/bot-amd64)
          BOT_ARM64=$(cat /tmp/digests/bot-arm64)
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME_BOT }}:latest \
            -t ${{ env.IMAGE_NAME_BOT }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME_BOT }}@${BOT_AMD64} \
            ${{ env.IMAGE_NAME_BOT }}@${BOT_ARM64}
